<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact RepoFinder</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="topnav" aria-label="Primary navigation">
      <a class="brand" href="/"><span class="radar" aria-hidden="true"></span><span>Repo<span class="accent">Finder</span></span></a>
      <div class="navlinks"><a href="/faq">FAQ</a><a href="/about">About</a><a href="https://github.com/motozero/repofinder.io" target="_blank" rel="noopener">GitHub</a></div>
    </nav>
    <main class="wrap page">
      <h1>Contact</h1>
      <p class="page-lede">Questions, feedback, or a repository RepoFinder should know about? Send Christo a note.</p>
      <form id="contact-form" class="contact">
        <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" maxlength="120" required /></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="200" required /></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6" maxlength="4000" required></textarea></div>
        <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off" /></div>
        <button id="contact-submit" type="submit">Send</button>
      </form>
      <p id="contact-status" class="status" role="status" hidden></p>
    </main>
    <footer class="foot"><span>Built with Codex, OpenAI, and Cloudflare.</span><a href="https://github.com/motozero/repofinder.io" target="_blank" rel="noopener">Source and lessons</a></footer>
    <script src="/app.js"></script>
  </body>
</html>
